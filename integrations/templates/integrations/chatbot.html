{% extends "global/base.html" %}

{% block chat_bot %}
  <div class="post-box">
    {% if response %}
      <h3>Assistente Virtual: </h3>
      <p>{{ response }}</p>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-link" type="submit">Enviar</button>
    </form>
  </div>
{% endblock chat_bot %}
