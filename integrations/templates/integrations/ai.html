<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua IA personalizada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        header {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        h1 {
            font-size: 20px;
            font-weight: bold;
        }
        
        main {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }
        
        footer {
            border-top: 1px solid #e5e7eb;
            padding: 16px;
        }
        
        .message-input-container {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        
        .message-input {
            flex: 1;
            padding-top: 4px;
        }
        
        input {
            width: 100%;
            padding: 8px 0;
            border: none;
            outline: none;
            font-size: 16px;
        }
        
        .button-container {
            display: flex;
            justify-content: flex-start;
        }
        
        button {
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 24px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>
    <header>
        <h1>Sua IA personalizada</h1>
    </header>
    
    <main>
        {% if chat_messages %}
          {% for message in chat_messages.bot_message %}
            <div>
              <p>
                {{ message }}
              </p>
            </div>
          {% endfor %}
        {% endif %}
    </main>
    
    <footer>
      <form method="POST">
        {% csrf_token %}
        <div class="message-input-container">
          {{ form.message}}
            {% comment %} <div class="message-input">
                <input type="text" placeholder="Digite uma mensagem aqui" autofocus>
            </div> {% endcomment %}
        </div>
        
        <div class="button-container">
            <button>Perguntar</button>
        </div>
      </form>
    </footer>
</body>
</html>
