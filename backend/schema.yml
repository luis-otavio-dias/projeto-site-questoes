openapi: 3.0.3
info:
  title: Your Project API
  version: 1.0.0
  description: Your project description
paths:
  /api/questions/:
    get:
      operationId: questions_retrieve
      tags:
      - questions
      responses:
        '200':
          description: No response body
  /api/questions/{id}/:
    get:
      operationId: questions_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - questions
      responses:
        '200':
          description: No response body
  /api/questions/exams/:
    get:
      operationId: questions_exams_list
      tags:
      - questions
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exam'
          description: ''
  /api/questions/exams/{id}/:
    get:
      operationId: questions_exams_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - questions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
          description: ''
  /api/questions/tasks/{id}/status/:
    get:
      operationId: questions_tasks_status_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - questions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamExtractionTask'
          description: ''
  /api/questions/upload-exam/:
    post:
      operationId: questions_upload_exam_create
      tags:
      - questions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamExtractionTask'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExamExtractionTask'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamExtractionTask'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamExtractionTask'
          description: ''
  /api/users/login/:
    post:
      operationId: users_login_create
      tags:
      - users
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/users/logout/:
    post:
      operationId: users_logout_create
      tags:
      - users
      responses:
        '200':
          description: No response body
  /api/users/me/profile/:
    get:
      operationId: users_me_profile_retrieve
      tags:
      - users
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/me/profile/update/:
    put:
      operationId: users_me_profile_update_update
      tags:
      - users
      responses:
        '200':
          description: No response body
  /api/users/refresh/:
    post:
      operationId: users_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/users/register/:
    post:
      operationId: users_register_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterUser'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUser'
          description: ''
  /api/users/upload_file/:
    post:
      operationId: users_upload_file_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FileUpload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUpload'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Exam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name_base:
          type: string
          maxLength: 150
        name_sigle:
          type: string
          maxLength: 50
        variant:
          type: string
          maxLength: 150
        year:
          type: string
          maxLength: 4
        style:
          type: string
          maxLength: 50
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
          readOnly: true
      required:
      - id
      - questions
    ExamExtractionTask:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        exam_file:
          type: string
          format: uri
        answer_key_file:
          type: string
          format: uri
        title:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - exam_file
      - id
      - status
    FileTypeEnum:
      enum:
      - csv
      - pdf
      type: string
      description: |-
        * `csv` - CSV File
        * `pdf` - PDF File
    FileUpload:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        file_type:
          oneOf:
          - $ref: '#/components/schemas/FileTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        file_upload:
          type: string
          format: uri
          nullable: true
      required:
      - id
    Question:
      type: object
      properties:
        area:
          type: string
          maxLength: 100
        topic:
          type: string
          maxLength: 100
        question_id:
          type: string
          maxLength: 100
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        passage_text:
          type: string
        sources:
          description: '[''Source 1'', ''Source 2'']'
        has_image:
          type: boolean
        stem:
          type: string
        options:
          description: '[{''label'': ''A'', ''text'': ''Option A text''}, ...]'
        correct_answer:
          type: string
          maxLength: 1
        images:
          type: array
          items:
            $ref: '#/components/schemas/QuestionImage'
          readOnly: true
      required:
      - correct_answer
      - id
      - images
      - stem
    QuestionImage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
        filename:
          type: string
          maxLength: 255
        mime_type:
          type: string
          maxLength: 50
      required:
      - filename
      - id
      - image
    RegisterUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          title: Senha
          maxLength: 128
      required:
      - email
      - id
      - password
    StatusEnum:
      enum:
      - PENDING
      - PROCESSING
      - COMPLETED
      - FAILED
      type: string
      description: |-
        * `PENDING` - Pending
        * `PROCESSING` - Processing
        * `COMPLETED` - Completed
        * `FAILED` - Failed
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      - id
