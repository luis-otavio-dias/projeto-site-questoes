[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django==5.1.7",
    "djangorestframework==3.16.0",
    "djangorestframework-simplejwt>=5.5.1",
    "django-cors-headers==4.7.0",
    "python-dotenv==1.0.1",
    "pillow>=12.0.0",
    "requests>=2.32.0",
    "rich>=14.2.0",
    "drf-spectacular>=0.29.0",
    "python-magic>=0.4.27",
    "pydantic>=2.13.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"
fix = true
show-fixes = true
indent-width = 4
exclude = [
  ".venv",
  "*/migrations/*.py",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "T201",   # Checks for print statements,
  "COM812", # Checks for the absence of trailing commas.
  "INP001", # Checks for packages that are missing an __init__.py file.
  "D",      # All pydocstyle (D)
  "ANN401", # Checks that function arguments are annotated with a more specific type than Any.
  "ERA001", # Checks for commented-out Python code.
  "A004",   # Shadowing Python Builtin
  "ARG001", # Unused function arguments
  "CPY001"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["backend", "project", "user", "question"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
include = ["apps"]
exclude = [
  "**/venv",
  "**/.venv",
  "**/env",
  "**/.env",
  "**/node_modules",
  "**/__pycache__",
  "*/migrations/*",
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "." }]

[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "backend.settings"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
