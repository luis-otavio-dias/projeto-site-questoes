{% extends "base.html" %}

{% block content %}

  <div class="form-wrapper">
    <h1>Entre com sua conta</h1>
      {% if messages %}
        {% for message in messages %}
          <div class="{{ message.tags }}-message {{ message.tags }}-box">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% include "user/partials/user_register.html" %}
    <div class="account-link">
      <p>Não tem conta? <a href="{% url "user:register" %}">Crie sua conta aqui</a></p>
    </div>
  </div>

{% endblock content %}
