<form action="{{ form_action }}" method="POST">
  {% csrf_token %}
  <div>
    {% for field in form %}
    <div class="input-box">
      <label for="{{ field.id_for_label }}" class="input-label"
      >
      {{ field }} {{ field.errors }} {% if field.help_text %}
      {% for help_text in field.help_text  %}
        <p class="help-text">{{ help_text }}</p>
      {% endfor %}
      
      {% endif %}
    </div>
    {% endfor %}
  </div>
  <div>
    <p><button class="btn-send" type="submit">Concluir</button></p>
  </div>
  <div class="account-link">
    <p>Já tem uma conta? <a href="{% url "user:login" %}">Faça login por aqui</a></p>
  </div>
</form>
