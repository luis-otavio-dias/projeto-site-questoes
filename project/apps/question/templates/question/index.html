{% extends "base.html" %}

{% block posts %}
  <div class="posts-wrapper">
    {% for question in questions %}
        <div>
          <p>{{ question.theme }} | {{ question.edition }}</p>
          <p>
            <a href="{% url "question:question" question.id %}" class="link-black">
              {{ question }}
            </a>
          </p>
        </div>
    {% endfor %}
  </div>
{% endblock posts %}
