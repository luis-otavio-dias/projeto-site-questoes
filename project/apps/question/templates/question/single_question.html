{% extends "global/base.html" %}

{% block single_post %}

  <div class="post-box">
    <p>
      {{ single_question.theme }} | {{ single_question.edition }}
    </p>

    <h1>
      {{ single_question.stem }}
    </h1>

    <form method="post" action="{% url "question:answer_question" single_question.id %}">
      {% csrf_token %}
      {{ form.reply }}
      <button class="btn btn-link" type="submit">Enviar</button>
    </form>
 
  </div>

{% endblock single_post %}
