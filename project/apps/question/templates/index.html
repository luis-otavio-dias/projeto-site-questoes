{% extends "base.html" %}

{% block body_class %}questions-block{% endblock body_class %}

{% block 'questions' %}
  <div class="posts-wrapper">
    {% for question in questions %}
      <div class="post-box">
        <a href="{% url "question:question" question.id %}" class="card-link">
          {% include "partials/question_card.html" with i=forloop.counter0 %}
        </a>
      </div>
    {% endfor %}
  </div>
{% endblock 'questions' %}
