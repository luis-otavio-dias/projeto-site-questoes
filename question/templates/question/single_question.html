{% extends "global/base.html" %}

{% block single_post %}

  <article class="post-box"> 
    <div>
      
      <p>
        {{ single_question.theme }} | {{ single_question.edition }}
      </p>

      <h2>
        {{ single_question }}
      </h2>

      {% for answer_option in single_question.answer_options.all %}
        <p>
          <b>{{ answer_option }}</b>
        </p>
      {% endfor %}

    </div>
  </article>

{% endblock single_post %}
