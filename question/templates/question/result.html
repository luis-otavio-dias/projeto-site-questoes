{% extends "global/base.html" %}

{% block single_post %}

<div class="post-box">
  <h1>
    {{ question }}
  </h1>
  <p>
    {{ message }}
  </p>
  {% if is_right %}
    <a href="{% url "question:index" %}">
      Retornar para as questões
    </a>
  {% else %}
    <a href="{% url "question:question" question.id %}">
      Tentar Novamente
    </a>
  {% endif %}
</div>
{% endblock single_post %}
