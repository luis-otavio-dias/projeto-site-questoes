{% extends "global/base.html" %}

{% block content %}
  {% for question in questions %}
    <div>
      <h1>
        {{ question.theme }}
      </h1>
      <h2>
        {{ question }}
      </h2>
      {% for answer_option in question.answer_options.all %}
        <h3>
            {{ answer_option }}
        </h3>
      {% endfor %}
    </div>
  {% endfor %}

{% endblock content %}
