{% extends "global/base.html" %}

{% block posts %}
  {% for question in questions %}
    <div class="post">
      
      <p>
        {{ question.theme }}
      </p>

      <h2>
        <a href="{% url "question:question" question.id %}">
          {{ question }}
        </a>
      </h2>

      {% for answer_option in question.answer_options.all %}
        <p>
            <b>{{ answer_option }}</b>
        </p>
      {% endfor %}

    </div>
  {% endfor %}
{% endblock posts %}
